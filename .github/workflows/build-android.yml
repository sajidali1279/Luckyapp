name: Build Android APK

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Debug - list mobile directory
        run: |
          echo "=== GITHUB_WORKSPACE: $GITHUB_WORKSPACE ==="
          echo "=== Files in mobile/ ==="
          ls -la "$GITHUB_WORKSPACE/mobile/"
          echo "=== google-services.json status ==="
          if [ -f "$GITHUB_WORKSPACE/mobile/google-services.json" ]; then
            echo "✅ EXISTS - $(wc -c < "$GITHUB_WORKSPACE/mobile/google-services.json") bytes"
          else
            echo "❌ NOT FOUND"
          fi

      - name: Install dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Debug - list mobile directory after npm ci
        run: |
          echo "=== After npm ci ==="
          ls -la "$GITHUB_WORKSPACE/mobile/" | grep -E "google|json"

      - name: Generate native Android project
        working-directory: ./mobile
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_SERVICES_JSON: ${{ github.workspace }}/mobile/google-services.json

      - name: Make gradlew executable
        working-directory: ./mobile/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./mobile/android
        run: ./gradlew assembleDebug --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lucky-stop-debug-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
